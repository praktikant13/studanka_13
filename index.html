<!DOCTYPE html>
<html>
<head>
  <title>Betty's Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- MAIN PAGE WRAPPER -->
  <!-- This holds the entire 3-column website layout -->
  <div class="page-layout">


    <!-- LEFT SIDEBAR -->
    <!-- This area will hold navigation links and small boxes -->
    <aside class="left-sidebar">

      <!-- LEFT BOX 1 -->
      <!-- Navigation menu -->
      <div class="box">
        <h2>Navigation</h2>

        <!-- Each <a> tag is a clickable link -->
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Notes</a>
        <a href="#">Links</a>
      </div>


      <!-- LEFT BOX 2 -->
      <!-- A second small sidebar panel -->
      <div class="box">
        <h2>Status</h2>
        <p>Learning Czech 🇨🇿</p>
        <p>Building this site 💻</p>
      </div>

    </aside>


    <!-- CENTER CONTENT -->
    <!-- This is the main part of the webpage -->
    <main class="main-content">

      <!-- CENTER BOX 1 -->
      <!-- Main welcome section -->
      <div class="box">
        <h1>Welcome!</h1>

        <p>
          This is my website.
        </p>

        <p>
          I am using it for notes, studying, research, and whatever else I want.
        </p>
      </div>


      <!-- CENTER BOX 2 -->
      <!-- Another content section underneath -->
      <div class="box">
        <h2>Latest Notes</h2>

        <p>
          Czech notes will go here.
        </p>
      </div>

    </main>


    <!-- RIGHT SIDEBAR -->
    <!-- This area can hold decorative or extra information -->
    <aside class="right-sidebar">

      <!-- RIGHT BOX 1 -->
      <!-- Small information panel -->
      <div class="box">
        <h2>Info</h2>

        <p>
          praktikant13
        </p>
      </div>


      <!-- RIGHT BOX 2 -->
      <!-- Another sidebar panel -->
      <div class="box">
        <h2>Currently</h2>

        <p>
          studying</p>
      </div>

    </aside>


  </div>

</body>
</html>
